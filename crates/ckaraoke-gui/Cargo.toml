[package]
name = "ckaraoke-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "CKaraoke desktop app (egui): library, queue, lyrics and mixer."

[[bin]]
name = "ckaraoke-gui"
path = "src/main.rs"

[dependencies]
ckaraoke-core = { path = "../ckaraoke-core" }
ckaraoke-audio = { path = "../ckaraoke-audio" }
eframe = "0.37"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"] }
